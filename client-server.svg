<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="t d">
  <title id="t">Client-server model</title>
  <desc id="d">A browser (client) sends an HTTP request to a web server, and the server sends back an HTTP response.</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#be185d"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9d174d"/>
    </marker>
  </defs>
  <g font-family="Trebuchet MS, Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="50" width="200" height="160" rx="14" fill="#ffe3ea" stroke="#be185d" stroke-width="2"/>
    <text x="120" y="100" font-size="22" font-weight="bold" fill="#500724">Client</text>
    <text x="120" y="128" font-size="14" fill="#5b2c3f">Web browser</text>
    <text x="120" y="150" font-size="14" fill="#5b2c3f">(laptop, phone, tablet)</text>
    <text x="120" y="180" font-size="13" fill="#5b2c3f">Asks for data</text>

    <rect x="580" y="50" width="200" height="160" rx="14" fill="#fff5f7" stroke="#500724" stroke-width="2"/>
    <text x="680" y="100" font-size="22" font-weight="bold" fill="#500724">Server</text>
    <text x="680" y="128" font-size="14" fill="#5b2c3f">Web host in a data center</text>
    <text x="680" y="150" font-size="14" fill="#5b2c3f">Stores files and data</text>
    <text x="680" y="180" font-size="13" fill="#5b2c3f">Sends data back</text>

    <line x1="230" y1="100" x2="568" y2="100" stroke="#be185d" stroke-width="3" marker-end="url(#a1)"/>
    <text x="400" y="88" font-size="15" font-weight="bold" fill="#831843">HTTP Request  (GET /index.html)</text>

    <line x1="570" y1="160" x2="232" y2="160" stroke="#9d174d" stroke-width="3" marker-end="url(#a2)"/>
    <text x="400" y="190" font-size="15" font-weight="bold" fill="#9d174d">HTTP Response  (200 OK + HTML)</text>
  </g>
</svg>
